[package]
name = "wasm-mloader-example"
version = "0.1.0"
edition = "2021"
description = "Source-only WebAssembly example plugin for dsh-mloader"
license = "LGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
