# Default configuration layer of dsh-mloader.
#
# This file is what makes the loader work without configuration: once the package
# appears in the profile's `dsh.profile.bundles`, dsh reads and applies this file
# automatically (package.json points `dsh.bundle.patch` at it). The user does not
# need to write any configuration in the profile's own `cordis.patch.yml`.
#
# To change any value, override the same id in the profile's `cordis.patch.yml`:
#
#     - id: dsh-mloader
#       config:
#         console: false
#
# Every key can be omitted. The values below are the defaults in src/index.ts.
# The most common keys are repeated here so the available switches are visible at a
# glance; the full key reference is in CONTEXT.md.
- insert:
    - id: dsh-mloader
      name: dsh-mloader
      config:
        # Extra plugin roots. Leave empty: <profile>/mloader/plugins is discovered
        # automatically (the loader takes the profile location from ctx.baseUrl).
        roots: []
        autoEnable: true
        pythonBin: python3
        statusTool: true
        # Register the /mloader command group (typed by the user).
        # true = default name, a string = custom name, false = disabled.
        # The optional commands service is probed at runtime; when it is missing
        # the command is skipped and plugin mounting continues.
        command: true
        # Release the bundled example into <profile>/mloader/plugins on first
        # start. An existing directory is skipped as a whole and never overwritten.
        seedExamples: true
        # Terminal output: true = lifecycle events only; 'verbose' = scan detail
        # as well; false = silent. It defaults to true because dsh's ctx.logger
        # does not print to the terminal, so without this channel a plugin would
        # load or fail invisibly on the command line.
        console: true
        # The WebAssembly backend is disabled by default. No bundled WebAssembly
        # example is shipped. Run test/wasm-safety.mjs (the binary must be built
        # first) before enabling it.
        wasm:
          enabled: false
